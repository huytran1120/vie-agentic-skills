<!doctype html>
<!-- Research explainer deck. One <section> per slide. For Persian: <html lang="fa" dir="rtl">.
     Keys: → / space next, ← previous, Home/End, p = print all slides (save as PDF). -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e0f12; --panel:#1a1c22; --text:#e9e9e9; --dim:#9aa0aa; --accent:#ffd166; --a:#58c4dd; --b:#fc6255; --c:#83c167; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: Inter, Vazirmatn, Tahoma, sans-serif; }
  html[dir=rtl] body { font-family: Vazirmatn, Inter, Tahoma, sans-serif; }
  .stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  section { display:none; box-sizing:border-box; width:1920px; height:1080px; padding:110px 128px 140px; position:relative;
    flex-direction:column; gap:36px; transform-origin:center; background:var(--bg); }
  section.on { display:flex; }
  h1 { font-size:84px; margin:0; line-height:1.2; } h2 { font-size:64px; margin:0; line-height:1.25; }
  p, li { font-size:32px; line-height:1.55; margin:0; } .small { font-size:24px; color:var(--dim); }
  .row { display:flex; gap:48px; align-items:flex-start; } html[dir=rtl] .row { flex-direction:row-reverse; }
  .card { flex:1; background:var(--panel); border-radius:16px; padding:32px; border-top:6px solid var(--accent); }
  .big { font-size:72px; font-weight:800; color:var(--accent); }
  .chip { display:inline-block; font-size:22px; padding:4px 14px; border-radius:999px; border:2px solid currentColor; }
  .final { color:var(--c); } .development, .preliminary, .progress { color:var(--accent); } .planned, .reported { color:var(--dim); }
  .source { position:absolute; bottom:56px; left:128px; right:128px; font-size:22px; color:var(--dim); }
  img { max-width:100%; image-rendering:auto; } img.pixel { image-rendering:pixelated; }
  .counter { position:fixed; bottom:12px; right:16px; font-size:14px; color:var(--dim); }
  @media print { @page { size:1920px 1080px; margin:0 } .stage { position:static; display:block }
    section { display:flex !important; transform:none !important; page-break-after:always; } .counter { display:none } }
</style>
</head>
<body>
<div class="stage">

<section>
  <h1>Title of the work</h1>
  <p class="small">Authors · venue / status · date</p>
</section>

<section>
  <h2>Result</h2>
  <div class="row">
    <div class="card"><p class="small">what is measured, on what</p><p class="big">18 of 20</p>
      <span class="chip final">final</span></div>
    <div class="card" style="border-top-color:var(--a)"><p>Short explanation, at most two sentences.</p></div>
  </div>
  <p class="source">source: paper p.7 Table 3 · our run experiments/x.py seed 0</p>
</section>

<!-- Persian example (inside a dir="rtl" deck):
<section>
  <h2>&#8207;نتیجه روی &#8294;CIFAR-10&#8297;&#8207;</h2>
  <p>&#8207;۱۸ از ۲۰ تصویر · <span class="chip final">نهایی</span>&#8207;</p>
</section> -->

</div>
<div class="counter"></div>
<script>
  const S = [...document.querySelectorAll("section")]; let i = 0;
  function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); S.forEach(s => s.style.transform = `scale(${k})`); }
  function show(n) { i = Math.max(0, Math.min(S.length - 1, n)); S.forEach((s, k) => s.classList.toggle("on", k === i));
    document.querySelector(".counter").textContent = `${i + 1} / ${S.length}`; }
  addEventListener("keydown", e => {
    const rtl = document.documentElement.dir === "rtl";
    if (["ArrowRight", " ", "PageDown"].includes(e.key)) show(i + ((e.key === "ArrowRight" && rtl) ? -1 : 1));
    if (["ArrowLeft", "PageUp"].includes(e.key)) show(i + ((e.key === "ArrowLeft" && rtl) ? 1 : -1));
    if (e.key === "Home") show(0); if (e.key === "End") show(S.length - 1); if (e.key === "p") print(); });
  addEventListener("resize", fit); addEventListener("click", () => show(i + 1)); fit(); show(0);
</script>
</body>
</html>
