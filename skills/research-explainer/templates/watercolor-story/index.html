<!doctype html>
<html lang="en"
  data-composition-variables='[{"id":"endline","type":"string","label":"End card: where the full video is","default":"Full video: link in the description"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540, height=960" />
    <!-- Draft canvas 540x960; the final export renders the same files at 1080x1920 with --resolution portrait. -->
    <!-- A made-up bakery: the people are invented; every number is from work/make_data.py (a seeded simulation). -->
    <script src="assets/fonts.js"></script>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/p5.min.js"></script>
    <script src="assets/lib/rough.js"></script>
    <script src="assets/lib/transitions.js"></script>
    <script src="assets/pstyle.js"></script>
    <script src="assets/puppets.js"></script>
    <script src="assets/data.js"></script>
    <script src="assets/captions.js"></script>
    <script src="assets/words.js"></script>
    <script src="assets/cues.js"></script>
    <script src="assets/mouth.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; background: #F3E9D2; }
      #root { position: relative; width: 100%; height: 100%; font: 400 16px "Inter", sans-serif; color: #1F2A44; }
      #bg { z-index: 0; }
      .scene-host { z-index: 10; }
      .trans-host { z-index: 50; }
      #captions { z-index: 100; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40.4" data-width="540" data-height="960">

      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-no-timeline
        data-start="0" data-duration="40.4" data-track-index="0" data-track-kind="graphics" data-width="540" data-height="960"></div>

      <div id="sA" class="scene-host" data-composition-id="sA" data-composition-src="compositions/sA.html"
        data-start="0" data-duration="13.95" data-track-index="1" data-track-kind="graphics" data-width="540" data-height="960"></div>
      <div id="sB1" class="scene-host" data-composition-id="sB1" data-composition-src="compositions/sB1.html"
        data-start="13.95" data-duration="3.65" data-track-index="1" data-track-kind="graphics" data-width="540" data-height="960"></div>
      <div id="sB2" class="scene-host" data-composition-id="sB2" data-composition-src="compositions/sB2.html"
        data-start="17.6" data-duration="16.4" data-track-index="1" data-track-kind="graphics" data-width="540" data-height="960"></div>
      <div id="s6" class="scene-host" data-composition-id="s6" data-composition-src="compositions/s6.html"
        data-start="34" data-duration="6.4" data-track-index="1" data-track-kind="graphics" data-width="540" data-height="960"></div>

      <!-- GL Transitions page curl between still frames of the kitchen and the explanation -->
      <div id="t1" class="trans-host" data-composition-id="t1" data-composition-src="compositions/t1.html"
        data-start="13.65" data-duration="0.6" data-track-index="2" data-track-kind="graphics" data-width="540" data-height="960"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="34.1" data-track-index="3" data-track-kind="captions" data-width="540" data-height="960"></div>

      <!-- narrator (gpt-audio-1.5, marin) + CC0 score (Lemo-Opuscar sampler), premixed through a limiter -->
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="40.4" data-track-index="4" data-volume="0.79"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
