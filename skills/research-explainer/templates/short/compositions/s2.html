<template>
  <style>
    @font-face { font-family: "Caveat"; src: url("assets/fonts/Caveat.ttf"); font-weight: 400 700; }
    #root { position: absolute; inset: 0; font-family: "Inter", sans-serif; color: #1F2A44; }
    #s2-title { position: absolute; left: 36px; top: 90px; font: 900 40px/1 "Inter", sans-serif; letter-spacing: -0.02em; }
    #s2-title b { color: #9C4130; }
    #s2-stamp { position: absolute; left: 330px; top: 98px; padding: 4px 9px; border: 2px solid #1D6B62; border-radius: 4px; color: #1D6B62;
      font: 700 14px "JetBrains Mono", monospace; letter-spacing: 0.06em; background: rgba(251,250,246,0.85); transform-origin: 50% 50%; }
    #s2-sigma { position: absolute; left: 36px; top: 138px; padding: 3px 12px 4px; border: 2px solid #1F2A44; border-radius: 14px; background: #FFFFFF;
      font: 700 18px "Inter", sans-serif; box-shadow: 2px 3px 0 rgba(31,42,68,0.15); transform-origin: 0% 50%; }
    #s2-sigma b { color: #9C4130; font-weight: 900; }
    #s2-panel { position: absolute; left: 24px; top: 176px; width: 492px; height: 408px; border: 2px solid #9FB3C8; border-radius: 6px;
      background-color: #FBFAF6;
      background-image: linear-gradient(#C9D6E3 1px, transparent 1px), linear-gradient(90deg, #C9D6E3 1px, transparent 1px);
      background-size: 18px 18px; box-shadow: 3px 4px 0 rgba(31,42,68,0.12); }
    #s2-panel-head { position: absolute; left: 14px; top: 9px; font: 700 14px "JetBrains Mono", monospace; color: #3C4660; }
    #s2-count { position: absolute; right: 14px; top: 6px; font: 700 18px "JetBrains Mono", monospace; color: #9C4130; }
    #s2-meter { position: absolute; left: 96px; top: 452px; width: 348px; height: 134px; border-radius: 20px; background: #1F2A44;
      transform-origin: 0% 0%; box-shadow: 5px 6px 0 rgba(31,42,68,0.22); }
    #s2-lcd { position: absolute; left: 16px; top: 16px; width: 200px; height: 72px; border-radius: 10px; background: #E4ECD9;
      font: 700 52px/72px "JetBrains Mono", monospace; color: #1F2A44; text-align: center; }
    #s2-pixi { position: absolute; left: 0; top: 0; width: 540px; height: 620px; }
  </style>
  <div id="root" data-composition-id="s2" data-width="540" data-height="960">
    <div id="s2-title"><b>20</b> readings</div>
    <div id="s2-stamp">SIMULATED · SEED 0</div>
    <div id="s2-sigma">noise: σ = <b id="s2-sig">0.25</b></div>
    <div id="s2-panel" data-layout-allow-overlap>
      <div id="s2-panel-head">same quantity · true value hidden</div>
      <div id="s2-count">1 / 20</div>
    </div>
    <div id="s2-meter" data-layout-ignore><div id="s2-lcd"></div></div>
    <canvas id="s2-pixi" width="540" height="620" data-layout-ignore></canvas>
  </div>
  <script>
    (function () {
      const D = window.DATA, R = D.readings;
      document.getElementById("s2-sig").textContent = D.sigma.toFixed(2);
      document.getElementById("s2-lcd").textContent = R[R.length - 1].toFixed(2);   // s1 ended on the last reading
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s2-title", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.fromTo("#s2-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.1);
      tl.fromTo("#s2-stamp", { opacity: 0, scale: 1.8, rotation: -14 }, { opacity: 1, scale: 1, rotation: -5, duration: 0.22, ease: "power3.in" }, 0.5);
      // the meter from the hook (it ended on reading 20) shrinks into card #20's slot, then the other cards rain down
      tl.fromTo("#s2-meter", { x: 0, y: 0, scale: 1, opacity: 1 }, { x: 389 - 96, y: 504 - 452, scale: 0.3, duration: 0.4, ease: "power3.inOut" }, 0);
      tl.to("#s2-meter", { opacity: 0, duration: 0.12 }, 0.34);
      // "with a spread of 0.25" (8.16-8.72 s, scene 3.21-3.77)
      tl.fromTo("#s2-sigma", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.2)" }, 3.2);
      tl.fromTo("#s2-sig", { scale: 1 }, { scale: 1.35, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 3.78);

      // ---- PixiJS: 20 reading cards, every pixel a function of scene time t ----
      const cv = document.getElementById("s2-pixi");
      const app = new PIXI.Application();
      const cards = []; let built = false; const state = { t: 0 };
      function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
      const rnd = rng(1405);
      const CW = 104, CH = 62, X0 = 47, Y0 = 216, GX = 10, GY = 10;
      const T0 = 0.42, STEP = 0.078, FALL = 0.42, SHIVER = 2.45, LAST = R.length - 1;
      const build = async () => {
        await document.fonts.ready;
        await app.init({ canvas: cv, width: 540, height: 620, backgroundAlpha: 0, antialias: true,
          resolution: window.devicePixelRatio || 1, autoDensity: true, autoStart: false, preference: "webgl" });
        app.ticker && app.ticker.stop();
        R.forEach((v, i) => {
          const c = new PIXI.Container();
          const sh = new PIXI.Graphics().roundRect(-CW / 2 + 3, -CH / 2 + 4, CW, CH, 9).fill({ color: 0x1F2A44, alpha: 0.16 });
          const g = new PIXI.Graphics().roundRect(-CW / 2, -CH / 2, CW, CH, 9).fill(0xFFFFFF).stroke({ width: 2, color: 0x1F2A44 });
          const tab = new PIXI.Graphics().roundRect(-CW / 2 + 6, -CH / 2 + 6, 30, 15, 4).fill(0x1F2A44);
          const id = new PIXI.Text({ text: "#" + String(i + 1).padStart(2, "0"), style: { fontFamily: "JetBrains Mono", fontWeight: "700", fontSize: 10, fill: 0xFBF3E2 } });
          id.anchor.set(0.5); id.position.set(-CW / 2 + 21, -CH / 2 + 13.5);
          const big = new PIXI.Text({ text: v.toFixed(2), style: { fontFamily: "Inter", fontWeight: "900", fontSize: 30, fill: 0x1F2A44 } });
          big.anchor.set(0.5); big.position.set(4, 7);
          c.addChild(sh, g, tab, id, big);
          const col = i % 4, row = Math.floor(i / 4);
          cards.push({ c, big, tx: X0 + col * (CW + GX) + CW / 2, ty: Y0 + row * (CH + GY) + CH / 2,
            x0: 60 + rnd() * 420, r0: (rnd() - 0.5) * 1.2, r1: (rnd() - 0.5) * 0.07, ph: rnd() * Math.PI * 2, t: i === LAST ? 0.36 : T0 + i * STEP });
          app.stage.addChild(c);
        });
        built = true; draw(state.t);
      };
      function clamp(x) { return Math.max(0, Math.min(1, x)); }
      function draw(t) {
        if (!built) return;
        let shown = 0;
        cards.forEach((k, i) => {
          if (t < k.t) { k.c.visible = false; return; }
          k.c.visible = true;
          const p = clamp((t - k.t) / FALL);
          if (i === LAST) {   // the hook's meter becomes this card: no fall, it settles in place
            const q = clamp((t - k.t) / 0.18);
            k.c.position.set(k.tx, k.ty); k.c.rotation = k.r1; k.c.scale.set(0.9 + 0.1 * q); k.c.alpha = q; shown++;
          } else {
            const e = 1 - Math.pow(1 - Math.min(p / 0.8, 1), 3);                 // fall
            const land = p > 0.8 ? Math.sin((p - 0.8) / 0.2 * Math.PI) : 0;   // little squash on landing
            k.c.position.set(k.x0 + (k.tx - k.x0) * e, -60 + (k.ty + 60) * e);
            k.c.rotation = k.r0 + (k.r1 - k.r0) * e; k.c.scale.set(1 + 0.06 * land, 1 - 0.08 * land); k.c.alpha = 1;
            if (p >= 0.8) shown++;
          }
          // "random noise" (7.44 s, scene 2.49): every card shivers, each with its own phase, and calms down
          const s = clamp((t - SHIVER) / 0.55);
          if (s > 0 && s < 1) k.c.rotation = k.r1 + 0.07 * Math.sin(s * 22 + k.ph) * (1 - s);
        });
        document.getElementById("s2-count").textContent = Math.max(1, shown) + " / " + R.length;
        app.render();
      }
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["s2-pixi"] = build();
      tl.fromTo(state, { t: 0 }, { t: 5.25, duration: 5.25, ease: "none", onUpdate: () => draw(state.t) }, 0);
      window.__timelines["s2"] = tl;
    })();
  </script>
</template>
