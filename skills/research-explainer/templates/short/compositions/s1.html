<template>
  <style>
    @font-face { font-family: "Caveat"; src: url("assets/fonts/Caveat.ttf"); font-weight: 400 700; }
    #root { position: absolute; inset: 0; font-family: "Inter", sans-serif; color: #1F2A44; }
    #s1-stage { position: absolute; left: 0; top: 0; width: 540px; height: 960px; transform-origin: 270px 360px; }
    #s1-kicker { position: absolute; left: 36px; top: 108px; font: 700 15px "JetBrains Mono", monospace; letter-spacing: 0.08em;
      color: #1D6B62; text-transform: uppercase; }
    #s1-head { position: absolute; left: 36px; top: 142px; width: 470px; font-weight: 900; font-size: 46px; line-height: 1.06;
      letter-spacing: -0.02em; }
    #s1-head .w { display: inline-block; }
    #s1-head .n { color: #9C4130; }
    #s1-q { position: absolute; left: 36px; top: 358px; font-weight: 900; font-size: 50px; line-height: 1; letter-spacing: -0.02em; color: #B5533C; }
    #s1-right { position: relative; display: inline-block; }
    #s1-circle { position: absolute; left: -20px; top: -18px; width: 210px; height: 92px; overflow: visible; }
    #s1-meter { position: absolute; left: 96px; top: 452px; width: 348px; height: 134px; border-radius: 20px; background: #1F2A44;
      box-shadow: 5px 6px 0 rgba(31,42,68,0.22); }
    #s1-lcd { position: absolute; left: 16px; top: 16px; width: 200px; height: 72px; border-radius: 10px; background: #E4ECD9;
      font: 700 52px/72px "JetBrains Mono", monospace; color: #1F2A44; text-align: center; }
    #s1-lab { position: absolute; left: 230px; top: 20px; width: 104px; font: 700 14px/1.3 "JetBrains Mono", monospace; color: #FBF3E2; }
    #s1-k { font: 900 26px/1.1 "Inter", sans-serif; color: #E9A23B; }
    #s1-scale { position: absolute; left: 16px; top: 100px; width: 316px; height: 22px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="s1" data-width="540" data-height="960">
    <div id="s1-stage">
      <div id="s1-kicker">A simple question</div>
      <div id="s1-head">
        <span class="w">Measure</span> <span class="w">the</span> <span class="w">same</span> <span class="w">thing</span>
        <span class="w n" id="s1-n1">20</span> <span class="w">times.</span> <span class="w">You</span> <span class="w">get</span>
        <span class="w n" id="s1-n2">20</span> <span class="w">different</span> <span class="w">answers.</span>
      </div>
      <div id="s1-q">Which one is <span id="s1-right">right?
        <svg id="s1-circle" viewBox="0 0 210 92"><path id="s1-circle-path" d="M 34 64 C 8 38, 50 6, 112 8 C 186 10, 214 44, 192 70 C 170 92, 76 92, 38 76 C 24 70, 26 58, 46 52"
          fill="none" stroke="#C8372D" stroke-width="5" stroke-linecap="round" /></svg></span></div>
      <div id="s1-meter">
        <div id="s1-lcd">1.03</div>
        <div id="s1-lab">reading<br><span id="s1-k">1</span> of 20</div>
        <svg id="s1-scale" viewBox="0 0 316 22" data-layout-ignore>
          <line x1="0" y1="14" x2="316" y2="14" stroke="#FBF3E2" stroke-width="2" opacity="0.6" />
          <g id="s1-ticks" stroke="#FBF3E2" stroke-width="1.5" opacity="0.6"></g>
          <path id="s1-ptr" d="M -7 0 L 7 0 L 0 12 Z" fill="#E9A23B" />
        </svg>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const D = window.DATA, R = D.readings, STEP = 0.23;          // a new reading every STEP seconds: all 20 by 4.6 s
      const X0 = 0.3, X1 = 1.7, sx = (v) => (v - X0) / (X1 - X0) * 316;
      let s = ""; for (let v = 0.4; v < 1.65; v += 0.1) s += '<line x1="' + sx(v).toFixed(1) + '" y1="9" x2="' + sx(v).toFixed(1) + '" y2="19" />';
      document.getElementById("s1-ticks").innerHTML = s;
      const lcd = document.getElementById("s1-lcd"), kk = document.getElementById("s1-k"), ptr = document.getElementById("s1-ptr");
      function show(t) {
        const k = Math.min(R.length - 1, Math.floor(t / STEP)), u = Math.min(1, (t - k * STEP) / 0.12);
        const prev = k > 0 ? R[k - 1] : R[0], v = prev + (R[k] - prev) * (1 - Math.pow(1 - u, 3));
        lcd.textContent = R[k].toFixed(2); kk.textContent = String(k + 1);
        ptr.setAttribute("transform", "translate(" + sx(v).toFixed(2) + " 0)");
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s1-stage", { scale: 1 }, { scale: 1.045, duration: 4.95, ease: "none" }, 0);   // slow push-in over the hook
      // the two "20"s kick when they are spoken (1.28 s, 2.48 s)
      [["#s1-n1", 1.28], ["#s1-n2", 2.48]].forEach(([id, t]) => {
        tl.fromTo(id, { scale: 1, rotation: 0 }, { scale: 1.18, rotation: -4, duration: 0.12, ease: "power2.out" }, t);
        tl.to(id, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(3)" }, t + 0.12);
      });
      // "right?" (4.40 s): the word kicks and the red circle is drawn round it
      const circle = document.getElementById("s1-circle-path"), len = circle.getTotalLength();
      tl.fromTo("#s1-right", { scale: 1, rotation: 0 }, { scale: 1.1, rotation: -3, duration: 0.14, ease: "power2.out" }, 4.36);
      tl.to("#s1-right", { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(3)" }, 4.5);
      tl.fromTo(circle, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.inOut" }, 4.4);
      tl.fromTo(circle, { opacity: 0 }, { opacity: 1, duration: 0.04 }, 4.4);   // a round cap would leave a dot before the stroke starts
      const st = { t: 0 }; show(0);
      tl.fromTo(st, { t: 0 }, { t: 4.95, duration: 4.95, ease: "none", onUpdate: () => show(st.t) }, 0);
      window.__timelines["s1"] = tl;
    })();
  </script>
</template>
