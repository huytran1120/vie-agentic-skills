<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VAS browser layout regression</title></head>
<body>
<pre id="layout-result">Running</pre>
<script src="./ui-contract-browser.js"></script>
<script>
(async () => {
  const errors = [];
  const measurements = [];
  const check = (condition, message) => { if (!condition) errors.push(message); };
  const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  const waitFor = async (test, message) => {
    for (let attempt = 0; attempt < 200 && !test(); attempt++) await wait(25);
    if (!test()) throw new Error(typeof message === 'function' ? message() : message);
  };
  const contractResponse = await fetch('./fixtures/ui-contract.json');
  if (!contractResponse.ok) throw new Error('Cannot load the approved UI contract');
  const contract = await contractResponse.json();
  const savedLanguage = localStorage.getItem('vas-language');
  const frame = document.createElement('iframe');
  frame.style.cssText = 'display:block;border:0;height:1000px;width:1440px';
  const page = new URLSearchParams(location.search).has('artifact') ? '../_site/index.html' : '../docs/index.html';
  frame.src = `${page}?lang=vi&layout-check=${Date.now()}`;
  const ready = new Promise((resolve, reject) => {
    frame.onload = resolve;
    frame.onerror = () => reject(new Error('Could not load catalog iframe'));
  });
  document.body.append(frame);
  try {
    await ready;
    const w = frame.contentWindow;
    const d = frame.contentDocument;
    const audit = label => VASUIContract.violations(d, w, contract).forEach(message => check(false, `${label}: ${message}`));
    w.addEventListener('error', event => errors.push(`Browser error: ${event.message}`));
    for (let attempt = 0; attempt < 200 && !d.querySelector('[data-skill]'); attempt++) await wait(25);
    check(Boolean(d.querySelector('[data-skill]')), 'Catalog must load real results');
    check(Boolean(w.VASMotion), 'Motion layer must initialize');
    check(!d.getElementById('source-collections').open, 'Source collections must stay secondary on a fresh homepage');
    const agent = d.getElementById('hero-agent');
    const heading = d.getElementById('intro-title');
    const cta = d.getElementById('hero-explore');
    const selected = () => new URL(w.location.href).searchParams.get('agent') || 'antigravity';
    const initialAgent = selected();
    check(!d.querySelector('[data-copy-element="quickstart-command"]').disabled, 'CLI search example must work without choosing a skill');
    await wait(1800);
    check(selected() === initialAgent, 'Decorative introduction must not change the installation agent');
    check(agent.getBoundingClientRect().width > 20, 'Agent reel must be visible on first load');
    const language = value => { if (d.documentElement.lang !== value) d.getElementById('language-toggle').click(); };
    // dump-dom virtual time does not advance the native view-transition compositor.
    // Exercise the production fallback here; verify native transitions in a real tab.
    const transitionDescriptor = Object.getOwnPropertyDescriptor(d, 'startViewTransition');
    Object.defineProperty(d, 'startViewTransition', { configurable: true, value: undefined });
    try {
      for (const theme of ['dark', 'light']) {
        if (d.documentElement.dataset.theme !== theme) d.getElementById('theme-toggle').click();
        await waitFor(() => d.documentElement.dataset.theme === theme, `Theme must become ${theme}`);
        cta.getAnimations().forEach(animation => animation.finish());
        await waitFor(() => w.getComputedStyle(cta).backgroundColor === VASUIContract.rgb(contract.themes[theme]['--accent']), () => `Primary color must settle in ${theme}: ${w.getComputedStyle(cta).backgroundColor}`);
        audit(theme);
      }
    } finally {
      if (transitionDescriptor) Object.defineProperty(d, 'startViewTransition', transitionDescriptor);
      else delete d.startViewTransition;
    }
    // Negative controls: prove the audit catches plausible accidental regressions.
    const badStyle = d.createElement('style');
    badStyle.textContent = ':root { --accent: #00ff00 !important; } * { font-family: serif !important; } #catalog { padding-top: 1000px !important; } #showcase { display: none !important; } #intro-title { opacity: 0 !important; } .hero-field { visibility: hidden !important; } .field-capsule { display: none !important; }';
    d.head.append(badStyle);
    try {
      const violations = VASUIContract.violations(d, w, contract);
      for (const name of ['palette:light:--accent', 'font:body', 'search:gap', 'section:#showcase:hidden', 'hero:#intro-title:hidden', 'hero:field-hidden', 'hero:particles-missing']) {
        check(violations.includes(name), `The UI guard must detect the injected regression ${name}`);
      }
    } finally { badStyle.remove(); }
    await waitFor(() => VASUIContract.violations(d, w, contract).length === 0, () => `Removing the negative control must restore the design: ${VASUIContract.violations(d, w, contract)}; font=${w.getComputedStyle(d.body).fontFamily}`);
    const field = d.querySelector('.hero-field');
    if (w.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const before = [...field.children].map(node => node.style.transform).join('|');
      await wait(120);
      check(before === [...field.children].map(node => node.style.transform).join('|'), 'Reduced motion must keep decorative particles still');
      check(!d.querySelector('[data-reveal="pending"]'), 'Reduced motion must not leave content pending and invisible');
    }

    for (const locale of contract.languages) {
      language(locale);
      check(d.documentElement.lang === locale, `${locale}: document language must update`);
      check(d.getElementById('readme-link').href === 'https://github.com/huytran1120/vie-agentic-skills/blob/main/README.md', `${locale}: guide link must open the rendered Vietnamese README with working repository links`);
      for (const node of d.querySelectorAll('[data-i18n]')) {
        if (node.id !== 'results-title') check(node.textContent === w.VASI18n.translate(node.dataset.i18n, locale), `${locale}: stale translation ${node.dataset.i18n}`);
      }
      // A previously hovered/focused desktop link must not leave offscreen ink on mobile.
      const githubNavigation = d.querySelector('.desktop-nav a[href="https://github.com/huytran1120/vie-agentic-skills"]');
      githubNavigation.focus({ preventScroll: true });
      githubNavigation.blur();
      for (const width of contract.widths) {
        frame.style.width = `${width}px`;
        await wait(80);
        const websiteNotice = d.getElementById('website-notice');
        check(websiteNotice.hidden, 'The GitHub Pages migration notice must stay hidden on other hosts');
        // Exercise the notice geometry locally; host selection is covered by the Node regression.
        websiteNotice.hidden = false;
        check(d.documentElement.scrollWidth <= w.innerWidth, `${locale} ${width}px: migration notice must not cause horizontal overflow`);
        const websiteAction = websiteNotice.querySelector('.button');
        check(websiteAction.href === 'https://vie-agentic-skills.vercel.app/', 'Migration CTA must link to the main website');
        check(websiteAction.getBoundingClientRect().height >= 44, 'Migration CTA must remain touch accessible');
        websiteNotice.hidden = true;
        const languageBox = d.getElementById('language-toggle').getBoundingClientRect();
        check(languageBox.width >= 44 && languageBox.left >= 0 && languageBox.right <= w.innerWidth, `${locale} ${width}px: language switch must be visible and touch accessible`);
        for (let option = 0; option < 7; option++) {
          const label = agent.getAttribute('aria-label');
          const before = selected();
          agent.click();
          check(selected() !== before, `${width}px: agent click must change selection`);
          check(agent.getAttribute('aria-label') !== label, `${width}px: accessible agent label must update`);
          await wait(30);
          const titleBox = heading.getBoundingClientRect();
          const reelBox = agent.getBoundingClientRect();
          check(titleBox.height < (width <= 540 ? 200 : 340), `${width}px: heading height ${titleBox.height} includes offscreen reel rows`);
          check(reelBox.height > 20 && reelBox.width > 20, `${width}px: agent reel must remain visible`);
          check(titleBox.right <= w.innerWidth + 1, `${width}px: heading overflows the viewport`);
          check(d.documentElement.scrollWidth <= w.innerWidth, `${width}px: horizontal page overflow`);
          check(cta.getBoundingClientRect().bottom < 760, `${width}px: primary action pushed outside the first viewport`);
        }
        audit(`${locale} ${width}px`);
        measurements.push({
          language: locale,
          width,
          headingHeight: Math.round(heading.getBoundingClientRect().height),
          actionBottom: Math.round(cta.getBoundingClientRect().bottom),
          searchTop: Math.round(d.getElementById('search-input').getBoundingClientRect().top),
          overflow: d.documentElement.scrollWidth > w.innerWidth
        });
      }
    }
    const keyboardFrame = document.createElement('iframe');
    keyboardFrame.style.cssText = 'display:block;border:0;height:1000px;width:390px';
    const keyboardReady = new Promise(resolve => { keyboardFrame.onload = resolve; });
    keyboardFrame.src = `${page}?lang=vi&agent=codex`;
    document.body.append(keyboardFrame);
    try {
      await keyboardReady;
      const kd = keyboardFrame.contentDocument, kw = keyboardFrame.contentWindow;
      await waitFor(() => kd.querySelector('[data-skill]'), 'Keyboard probe must load the catalog');
      const search = kd.getElementById('search-input');
      for (const shortcut of [{ key: 'k', ctrlKey: true }, { key: 'k', metaKey: true }, { key: '/' }]) {
        kd.getElementById('language-toggle').focus();
        const event = new kw.KeyboardEvent('keydown', { ...shortcut, bubbles: true, cancelable: true });
        kd.activeElement.dispatchEvent(event);
        check(kd.activeElement === search && event.defaultPrevented, `Search shortcut ${JSON.stringify(shortcut)} must focus search`);
      }
      const editing = new kw.KeyboardEvent('keydown', { key: '/', bubbles: true, cancelable: true });
      search.dispatchEvent(editing);
      check(!editing.defaultPrevented && kd.activeElement === search, 'Slash while editing must remain ordinary input');
      const focusForm = search.closest('form');
      const focusStyle = kw.getComputedStyle(focusForm);
      check(focusForm.matches(':focus-within') && focusStyle.borderTopColor === VASUIContract.rgb(contract.themes[kd.documentElement.dataset.theme || 'light']['--accent']), 'Focused search must expose its accent border');
      for (const width of [390, 320]) {
        keyboardFrame.style.width = `${width}px`;
        await wait(80);
        const menu = kd.getElementById('mobile-menu'), toggle = kd.getElementById('menu-toggle');
        const box = toggle.getBoundingClientRect();
        const style = kw.getComputedStyle(toggle);
        check(box.width >= 44 && box.height >= 44 && box.left >= 0 && box.right <= kw.innerWidth && box.top >= 0 && box.bottom <= kw.innerHeight && style.visibility !== 'hidden' && style.opacity !== '0', `${width}px: mobile menu must be a visible 44px target`);
        toggle.click();
        check(!menu.hidden && toggle.getAttribute('aria-expanded') === 'true', `${width}px: menu must open with synchronized accessible state`);
        toggle.focus();
        toggle.dispatchEvent(new kw.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
        check(menu.hidden && toggle.getAttribute('aria-expanded') === 'false' && kd.activeElement === toggle, `${width}px: Escape must close menu and restore focus`);
        toggle.click(); menu.querySelector('a[href="#catalog"]').click();
        check(menu.hidden && toggle.getAttribute('aria-expanded') === 'false', `${width}px: choosing a section must close the mobile menu`);
      }
    } finally { keyboardFrame.remove(); }
    frame.style.width = '390px';
    await wait(80);
    // Keep independent task/guide scenarios in their own document. Chromium limits
    // rapid history IPC writes per frame; the lifecycle flow below already exercises
    // many installs and should not share that synthetic throughput with these cases.
    const workflowFrame = document.createElement('iframe');
    workflowFrame.style.cssText = 'display:block;border:0;height:1000px;width:390px';
    const workflowReady = new Promise(resolve => { workflowFrame.onload = resolve; });
    workflowFrame.src = `${page}?lang=vi&workflow-check=${Date.now()}`;
    document.body.append(workflowFrame);
    try {
      await workflowReady;
      const w = workflowFrame.contentWindow, d = workflowFrame.contentDocument;
      await waitFor(() => d.querySelector('#skills-results [data-skill]'), 'Workflow catalog must load');
      w.addEventListener('error', event => errors.push(`Workflow browser error: ${event.message}`));
      const selected = () => new URL(w.location.href).searchParams.get('agent') || 'antigravity';
      const language = value => { if (d.documentElement.lang !== value) d.getElementById('language-toggle').click(); };
      const workflowAgent = selected();
      const workflowChange = (id, value) => {
        const field = d.getElementById(id);
        field.value = value;
        field.dispatchEvent(new w.Event('change', { bubbles: true }));
      };
      workflowChange('quick-agent-select', 'claude');
      for (const locale of ['vi', 'en']) {
        language(locale);
        for (const [attribute, value] of [['group', 'web'], ['group', 'testing'], ['group', 'devops'], ['group', 'security'], ['category', 'media']]) {
          // Begin with incompatible filters so a task cannot accidentally reuse an empty intersection.
          d.getElementById('youtube-collection').click();
          workflowChange('category-select', 'security');
          const search = d.getElementById('search-input');
          search.value = 'nonexistent-workflow-regression';
          search.dispatchEvent(new w.Event('input', { bubbles: true }));
          const task = d.querySelector(`[data-workflow-${attribute}="${value}"]`);
          check(task?.tagName === 'A' && task.hasAttribute('href'), `${locale}: task ${value} must have a native link fallback`);
          task.click();
          const params = new URL(w.location.href).searchParams;
          check(params.get(attribute) === value, `${locale}: task ${value} must select the requested catalog filter`);
          check(!params.has('q') && !params.has('sources') && !params.has(attribute === 'group' ? 'category' : 'group'), `${locale}: task ${value} must clear unrelated filters`);
          check(params.get('agent') === 'claude' && params.get('lang') === locale, `${locale}: task ${value} must preserve agent and language`);
          check(search.value === '' && d.activeElement === search, `${locale}: task ${value} must expose and focus the search field`);
          check(d.querySelectorAll('#skills-results [data-skill]').length > 0, `${locale}: task ${value} must show real results`);
        }
        for (const region of ['.desktop-nav', '#mobile-menu', '.site-footer']) {
          const blog = d.querySelector(`${region} [data-guide-link]`);
          check(Boolean(blog), `${locale}: ${region} must link to the separate Blog page`);
          const destination = new URL(blog.href);
          check(destination.pathname.endsWith('/blog/') && !destination.hash, `${locale}: ${region} must leave the catalog for Blog`);
          check(destination.searchParams.get('agent') === 'claude' && destination.searchParams.get('lang') === locale, `${locale}: ${region} Blog link must carry agent and language`);
          check(!blog.hasAttribute('data-library-link') && !blog.hasAttribute('data-open-cli'), `${locale}: ${region} Blog link must not trigger SPA section navigation or CLI setup`);
        }
        const guides = [...d.querySelectorAll('#applications [data-guide-link]')];
        for (const slug of ['agent-skills-la-gi', 'kiem-thu-web-voi-playwright', 'tao-video-voi-claude-code-remotion']) {
          const guide = guides.find(link => new URL(link.href).pathname.endsWith(`/blog/${slug}/`));
          check(Boolean(guide), `${locale}: ${slug} must link to a real article`);
          const destination = new URL(guide.href);
          check(destination.searchParams.get('agent') === 'claude' && destination.searchParams.get('lang') === locale, `${locale}: ${slug} must carry the current reader context`);
          check(!destination.searchParams.has('q') && !destination.searchParams.has('category'), `${locale}: guide links must not inherit unrelated catalog filters`);
          const response = await w.fetch(guide.href);
          check(response.ok && (await response.text()).includes('<h1'), `${locale}: ${slug} must load an actual article`);
        }
      }
      d.getElementById('reset-filters').click();
      workflowChange('quick-agent-select', workflowAgent);
    } finally { workflowFrame.remove(); }
    // Retain a catalog fragment in the main history flow: Back must restore the
    // opened result's focus even after native fragment restoration finishes.
    d.querySelector('[data-workflow-group="web"]').click();
    d.getElementById('reset-filters').click();
    const chosenAgent = selected();
    d.getElementById('load-more').click();
    const laterResult = d.querySelectorAll('#skills-results .skill-name')[8];
    check(Boolean(laterResult), 'Load more must expose a result beyond the first six skills');
    laterResult.scrollIntoView({ block: 'center', behavior: 'instant' });
    const listScroll = w.scrollY;
    const laterId = laterResult.dataset.openSkill;
    laterResult.click();
    check(!d.getElementById('detail-view').hidden, 'A result from the second page must open');
    w.history.back();
    await waitFor(() => !d.getElementById('library-view').hidden, 'Back must restore the catalog');
    await wait(80);
    check(d.querySelectorAll('#skills-results [data-skill]').length === 12, 'Back must preserve loaded result pages');
    check(Boolean(d.querySelector(`#skills-results [data-open-skill="${laterId}"]`)), 'The opened result must still be available after Back');
    check(d.activeElement.dataset.openSkill === laterId, 'Back must restore keyboard focus to the opened skill');
    check(Math.abs(w.scrollY - listScroll) < 3, `Back must restore the previous list scroll position (expected ${listScroll}, got ${w.scrollY})`);
    const readerSearch = d.getElementById('search-input');
    readerSearch.value = 'senior-frontend';
    readerSearch.dispatchEvent(new w.Event('input', { bubbles: true }));
    d.querySelector('[data-open-skill="senior-frontend"]').click();
    await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'Senior frontend must load for TOC navigation');
    const tocLink = d.querySelector('#runbook-content a[href="#runbook-project-scaffolding"]');
    check(Boolean(tocLink) && !tocLink.target, 'The original runbook TOC must target its rendered heading in this tab');
    const scrollBehavior = d.documentElement.style.scrollBehavior;
    // Chromium's dump-dom virtual clock does not advance compositor smooth scrolling.
    // Keep native fragment navigation and its geometry assertion deterministic here.
    d.documentElement.style.scrollBehavior = 'auto';
    try {
      tocLink.click();
      await waitFor(() => w.location.hash === '#runbook-project-scaffolding', 'Runbook TOC click must navigate to the rendered section');
      check(!d.getElementById('detail-view').hidden, 'Fragment navigation must keep the current reader open');
      await waitFor(() => d.getElementById('runbook-project-scaffolding').getBoundingClientRect().top < 300, () => `Runbook fragment navigation must scroll to the requested heading (top ${d.getElementById('runbook-project-scaffolding').getBoundingClientRect().top}, scroll ${w.scrollY}, hash ${w.location.hash})`);
    } finally { d.documentElement.style.scrollBehavior = scrollBehavior; }
    const detailScroll = w.scrollY;
    d.querySelector('[data-back-library]').click();
    check(d.activeElement.dataset.openSkill === 'senior-frontend', 'Return to library must focus the previously opened result');
    w.history.back();
    await waitFor(() => !d.getElementById('detail-view').hidden, 'Back from the library must restore the previous detail');
    await wait(80);
    check(Math.abs(w.scrollY - detailScroll) < 3, `Back must retain the outgoing detail scroll position (expected ${detailScroll}, got ${w.scrollY})`);
    for (const fragment of ['#catalog', '#showcase', '#quickstart']) {
      const readerScroll = w.scrollY;
      d.querySelector(`.desktop-nav a[href="${fragment}"]`).click();
      check(d.getElementById('detail-view').hidden, `${fragment}: header navigation must show the library`);
      check(w.location.hash === fragment, `${fragment}: header navigation must set the requested section`);
      w.history.back();
      await waitFor(() => !d.getElementById('detail-view').hidden, `${fragment}: one Back must restore the runbook`);
      await wait(80);
      check(Math.abs(w.scrollY - readerScroll) < 3, `${fragment}: Back must retain reader scroll (expected ${readerScroll}, got ${w.scrollY})`);
    }
    d.querySelector('[data-back-library]').click();
    d.getElementById('clear-search').click();
    readerSearch.value = 'kiểm thử';
    readerSearch.dispatchEvent(new w.Event('input', { bubbles: true }));
    check(Boolean(d.querySelector('#skills-results [data-open-skill="webapp-testing"]')), 'Vietnamese search must find the visible testing summary');
    readerSearch.value = 'content-strategy';
    readerSearch.dispatchEvent(new w.Event('input', { bubbles: true }));
    d.querySelector('#skills-results [data-open-skill="content-strategy"]').click();
    await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'Content strategy must load for reference links');
    const reference = d.querySelector('#runbook-content strong a[href$="/content-strategy/references/headless-cms.md"]');
    check(Boolean(reference), 'Bold references must remain clickable links in the real reader');
    d.querySelector('[data-back-library]').click();
    d.getElementById('clear-search').click();
    w.scrollTo({ top: 0, behavior: 'instant' });
    let installPrompt;
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true, value: { writeText: async text => { installPrompt = text; } } });
    const listCopy = d.querySelector('[data-copy-agent-prompt="code-review"]');
    check(Boolean(listCopy) && !listCopy.disabled, 'List results must offer installation prompt copying');
    listCopy.click();
    await waitFor(() => Boolean(installPrompt), 'List installation prompt must copy after manifest validation');
    check(installPrompt.includes('/install-manifests/code-review.json'), 'Copied prompt must use the official per-skill manifest');
    d.querySelector('[data-open-skill="code-review"]').click();
    check(!d.getElementById('detail-view').hidden, 'Runbook details must open');
    check(d.getElementById('agent-select').value === chosenAgent, 'Hero selection must reach the install panel');
    check(!d.querySelector('#skill-detail [data-copy-agent-prompt]').disabled, 'Quick copy must work without the absolute CLI project path');
    check(!d.getElementById('cli-installation').open, 'Advanced CLI fields must not distract from the no-clone installation path');
    d.getElementById('cli-installation').open = true;
    check(d.querySelector('[data-copy-skill]').disabled, 'CLI copy must still require its project path');
    check(!d.getElementById('agent-install-prompt').textContent.includes('/Projects/'), 'Quick prompt must not contain CLI absolute paths');
    d.getElementById('install-scope').value = 'global';
    d.getElementById('install-scope').dispatchEvent(new w.Event('change', { bubbles: true }));
    check(d.getElementById('installation-command').textContent.includes(`--target ${chosenAgent} --mode link`), 'Generated command must use the selected agent');
    const change = (id, value) => {
      const field = d.getElementById(id);
      field.value = value;
      field.dispatchEvent(new w.Event(id === 'project-path' ? 'input' : 'change', { bubbles: true }));
    };
    change('install-scope', 'project');
    change('project-path', '/Projects/example app');
    change('install-mode', 'copy');
    check(d.getElementById('installation-command').textContent.includes('--mode copy --dest '), 'Copy mode must update the install command');
    check(d.getElementById('install-status').textContent.includes('--dest '), 'Status must check the same project destination');
    check(d.getElementById('install-uninstall').textContent.includes('--dest '), 'Uninstall must use the same project destination');
    check(d.getElementById('install-prompt').textContent.includes('/Projects/example app/'), 'Prompt must point at the installed runbook');
    d.getElementById('installation-after').open = true;
    await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'Runbook must finish loading');
    const originalRunbook = () => {
      const content = d.getElementById('runbook-content').cloneNode(true);
      content.querySelectorAll('button').forEach(button => button.remove());
      return content.textContent;
    };
    const originalText = originalRunbook();
    const lifecycle = ['installation-command', 'install-status', 'install-uninstall', 'installed-paths'];
    const commands = lifecycle.map(id => d.getElementById(id).textContent);
    for (const locale of ['en', 'vi']) {
      language(locale);
      check(d.getElementById('project-path').value === '/Projects/example app', `${locale}: switching language must preserve the project path`);
      check(d.getElementById('install-mode').value === 'copy' && d.getElementById('install-scope').value === 'project', `${locale}: installation choices must be preserved`);
      check(d.getElementById('installation-after').open, `${locale}: post-install instructions must stay open`);
      check(d.getElementById('cli-installation').open, `${locale}: expanded CLI controls must stay open`);
      check(JSON.stringify(lifecycle.map(id => d.getElementById(id).textContent)) === JSON.stringify(commands), `${locale}: executable commands and paths must not be translated`);
      check(d.getElementById('install-prompt').textContent.startsWith(locale === 'en' ? 'Read the runbook' : 'Hãy đọc runbook'), `${locale}: sample prompt must be translated`);
      check(d.getElementById('agent-install-prompt').textContent.startsWith(locale === 'en' ? 'Please install' : 'Hãy cài đặt skill'), `${locale}: quick install prompt must be translated separately`);
      check(!d.getElementById('agent-install-prompt').textContent.includes('/Projects/example app'), `${locale}: quick install must not inherit private CLI paths`);
      await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'Translated runbook controls must finish loading');
      check(originalRunbook() === originalText, `${locale}: original runbook content must not change`);
      const codeButton = d.querySelector('[data-copy-code]');
      if (codeButton) check(codeButton.textContent === (locale === 'en' ? 'Copy code' : 'Sao chép mã'), `${locale}: runbook controls must be translated`);
    }
    w.history.back();
    await waitFor(() => d.documentElement.lang === 'en', 'Back must restore English');
    w.history.forward();
    await waitFor(() => d.documentElement.lang === 'vi', 'Forward must restore Vietnamese');
    check(d.getElementById('project-path').value === '/Projects/example app', 'History navigation must preserve the private installation path');
    let sharedLink;
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true, value: { writeText: async text => { sharedLink = text; installPrompt = text; } } });
    d.querySelector('[data-share-skill]').click();
    check(new URL(sharedLink).searchParams.get('lang') === 'vi', 'Shared links must retain the interface language');
    check(!sharedLink.includes('Projects') && !sharedLink.includes('scope=') && !sharedLink.includes('mode='), 'Sharing must never disclose installation paths or settings');

          `Direct PDF link / reload ${reload}: requested section must be visible after async render (top ${section.getBoundingClientRect().top}, scroll ${probe.contentWindow.scrollY})`);
      }
    } finally { probe.remove(); }
  } catch (error) {
    errors.push(error.stack || String(error));
  } finally {
    if (savedLanguage === null) localStorage.removeItem('vas-language');
    else localStorage.setItem('vas-language', savedLanguage);
  }
  document.getElementById('layout-result').textContent = JSON.stringify({ errors, measurements });
  document.documentElement.dataset.layoutComplete = 'true';
})();
</script>
</body>
</html>
