<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VAS browser layout regression</title></head>
<body>
<pre id="layout-result">Running</pre>
<script>
(async () => {
  const errors = [];
  const measurements = [];
  const check = (condition, message) => { if (!condition) errors.push(message); };
  const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  const waitFor = async (test, message) => {
    for (let attempt = 0; attempt < 200 && !test(); attempt++) await wait(25);
    if (!test()) throw new Error(typeof message === 'function' ? message() : message);
  };
  const savedLanguage = localStorage.getItem('vas-language');
  const frame = document.createElement('iframe');
  frame.style.cssText = 'display:block;border:0;height:1000px;width:1440px';
  const page = new URLSearchParams(location.search).has('artifact') ? '../_site/index.html' : '../docs/index.html';
  frame.src = `${page}?lang=vi&layout-check=${Date.now()}`;
  const ready = new Promise((resolve, reject) => {
    frame.onload = resolve;
    frame.onerror = () => reject(new Error('Could not load catalog iframe'));
  });
  document.body.append(frame);
  try {
    await ready;
    const w = frame.contentWindow;
    const d = frame.contentDocument;
    w.addEventListener('error', event => errors.push(`Browser error: ${event.message}`));
    for (let attempt = 0; attempt < 200 && !d.querySelector('[data-skill]'); attempt++) await wait(25);
    check(Boolean(d.querySelector('[data-skill]')), 'Catalog must load real results');
    check(Boolean(w.VASMotion), 'Motion layer must initialize');
    const agent = d.getElementById('hero-agent');
    const heading = d.getElementById('intro-title');
    const cta = d.getElementById('hero-explore');
    const selected = () => new URL(w.location.href).searchParams.get('agent') || 'antigravity';
    const initialAgent = selected();
    check(!d.querySelector('[data-copy-element="quickstart-command"]').disabled, 'CLI search example must work without choosing a skill');
    await wait(1800);
    check(selected() === initialAgent, 'Decorative introduction must not change the installation agent');
    check(agent.getBoundingClientRect().width > 20, 'Agent reel must be visible on first load');
    const language = value => { if (d.documentElement.lang !== value) d.getElementById('language-toggle').click(); };
    for (const locale of ['vi', 'en']) {
      language(locale);
      check(d.documentElement.lang === locale, `${locale}: document language must update`);
      check(d.getElementById('readme-link').getAttribute('href').endsWith(locale === 'en' ? '/README_EN.md' : '/README.md'), `${locale}: guide link must match the language`);
      for (const node of d.querySelectorAll('[data-i18n]')) {
        if (node.id !== 'results-title') check(node.textContent === w.VASI18n.translate(node.dataset.i18n, locale), `${locale}: stale translation ${node.dataset.i18n}`);
      }
      for (const width of [1440, 1024, 768, 390, 320]) {
        frame.style.width = `${width}px`;
        await wait(80);
        const languageBox = d.getElementById('language-toggle').getBoundingClientRect();
        check(languageBox.width >= 44 && languageBox.left >= 0 && languageBox.right <= w.innerWidth, `${locale} ${width}px: language switch must be visible and touch accessible`);
        for (let option = 0; option < 7; option++) {
          const label = agent.getAttribute('aria-label');
          const before = selected();
          agent.click();
          check(selected() !== before, `${width}px: agent click must change selection`);
          check(agent.getAttribute('aria-label') !== label, `${width}px: accessible agent label must update`);
          await wait(30);
          const titleBox = heading.getBoundingClientRect();
          const reelBox = agent.getBoundingClientRect();
          check(titleBox.height < (width <= 540 ? 200 : 340), `${width}px: heading height ${titleBox.height} includes offscreen reel rows`);
          check(reelBox.height > 20 && reelBox.width > 20, `${width}px: agent reel must remain visible`);
          check(titleBox.right <= w.innerWidth + 1, `${width}px: heading overflows the viewport`);
          check(d.documentElement.scrollWidth <= w.innerWidth, `${width}px: horizontal page overflow`);
          check(cta.getBoundingClientRect().bottom < 760, `${width}px: primary action pushed outside the first viewport`);
        }
        measurements.push({
          language: locale,
          width,
          headingHeight: Math.round(heading.getBoundingClientRect().height),
          actionBottom: Math.round(cta.getBoundingClientRect().bottom),
          searchTop: Math.round(d.getElementById('search-input').getBoundingClientRect().top),
          overflow: d.documentElement.scrollWidth > w.innerWidth
        });
      }
    }
    frame.style.width = '390px';
    await wait(80);
    const chosenAgent = selected();
    d.getElementById('load-more').click();
    const laterResult = d.querySelectorAll('#skills-results .skill-name')[8];
    check(Boolean(laterResult), 'Load more must expose a result beyond the first six skills');
    laterResult.scrollIntoView({ block: 'center', behavior: 'instant' });
    const listScroll = w.scrollY;
    const laterId = laterResult.dataset.openSkill;
    laterResult.click();
    check(!d.getElementById('detail-view').hidden, 'A result from the second page must open');
    w.history.back();
    await waitFor(() => !d.getElementById('library-view').hidden, 'Back must restore the catalog');
    await wait(80);
    check(d.querySelectorAll('#skills-results [data-skill]').length === 12, 'Back must preserve loaded result pages');
    check(Boolean(d.querySelector(`#skills-results [data-open-skill="${laterId}"]`)), 'The opened result must still be available after Back');
    check(Math.abs(w.scrollY - listScroll) < 3, `Back must restore the previous list scroll position (expected ${listScroll}, got ${w.scrollY})`);
    const readerSearch = d.getElementById('search-input');
    readerSearch.value = 'senior-frontend';
    readerSearch.dispatchEvent(new w.Event('input', { bubbles: true }));
    d.querySelector('[data-open-skill="senior-frontend"]').click();
    await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'Senior frontend must load for TOC navigation');
    const tocLink = d.querySelector('#runbook-content a[href="#runbook-project-scaffolding"]');
    check(Boolean(tocLink) && !tocLink.target, 'The original runbook TOC must target its rendered heading in this tab');
    const scrollBehavior = d.documentElement.style.scrollBehavior;
    // Chromium's dump-dom virtual clock does not advance compositor smooth scrolling.
    // Keep native fragment navigation and its geometry assertion deterministic here.
    d.documentElement.style.scrollBehavior = 'auto';
    try {
      tocLink.click();
      await waitFor(() => w.location.hash === '#runbook-project-scaffolding', 'Runbook TOC click must navigate to the rendered section');
      check(!d.getElementById('detail-view').hidden, 'Fragment navigation must keep the current reader open');
      await waitFor(() => d.getElementById('runbook-project-scaffolding').getBoundingClientRect().top < 300, () => `Runbook fragment navigation must scroll to the requested heading (top ${d.getElementById('runbook-project-scaffolding').getBoundingClientRect().top}, scroll ${w.scrollY}, hash ${w.location.hash})`);
    } finally { d.documentElement.style.scrollBehavior = scrollBehavior; }
    const detailScroll = w.scrollY;
    d.querySelector('[data-back-library]').click();
    w.history.back();
    await waitFor(() => !d.getElementById('detail-view').hidden, 'Back from the library must restore the previous detail');
    await wait(80);
    check(Math.abs(w.scrollY - detailScroll) < 3, `Back must retain the outgoing detail scroll position (expected ${detailScroll}, got ${w.scrollY})`);
    d.querySelector('[data-back-library]').click();
    d.getElementById('clear-search').click();
    w.scrollTo({ top: 0, behavior: 'instant' });
    let installPrompt;
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true, value: { writeText: async text => { installPrompt = text; } } });
    const listCopy = d.querySelector('[data-copy-agent-prompt="code-review"]');
    check(Boolean(listCopy) && !listCopy.disabled, 'List results must offer installation prompt copying');
    listCopy.click();
    await waitFor(() => Boolean(installPrompt), 'List installation prompt must copy after manifest validation');
    check(installPrompt.includes('/install-manifests/code-review.json'), 'Copied prompt must use the official per-skill manifest');
    d.querySelector('[data-open-skill="code-review"]').click();
    check(!d.getElementById('detail-view').hidden, 'Runbook details must open');
    check(d.getElementById('agent-select').value === chosenAgent, 'Hero selection must reach the install panel');
    check(!d.querySelector('#skill-detail [data-copy-agent-prompt]').disabled, 'Quick copy must work without the absolute CLI project path');
    check(!d.getElementById('cli-installation').open, 'Advanced CLI fields must not distract from the no-clone installation path');
    d.getElementById('cli-installation').open = true;
    check(d.querySelector('[data-copy-skill]').disabled, 'CLI copy must still require its project path');
    check(!d.getElementById('agent-install-prompt').textContent.includes('/Projects/'), 'Quick prompt must not contain CLI absolute paths');
    d.getElementById('install-scope').value = 'global';
    d.getElementById('install-scope').dispatchEvent(new w.Event('change', { bubbles: true }));
    check(d.getElementById('installation-command').textContent.includes(`--target ${chosenAgent} --mode link`), 'Generated command must use the selected agent');
    const change = (id, value) => {
      const field = d.getElementById(id);
      field.value = value;
      field.dispatchEvent(new w.Event(id === 'project-path' ? 'input' : 'change', { bubbles: true }));
    };
    change('install-scope', 'project');
    change('project-path', '/Projects/example app');
    change('install-mode', 'copy');
    check(d.getElementById('installation-command').textContent.includes('--mode copy --dest '), 'Copy mode must update the install command');
    check(d.getElementById('install-status').textContent.includes('--dest '), 'Status must check the same project destination');
    check(d.getElementById('install-uninstall').textContent.includes('--dest '), 'Uninstall must use the same project destination');
    check(d.getElementById('install-prompt').textContent.includes('/Projects/example app/'), 'Prompt must point at the installed runbook');
    d.getElementById('installation-after').open = true;
    await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'Runbook must finish loading');
    const originalRunbook = () => {
      const content = d.getElementById('runbook-content').cloneNode(true);
      content.querySelectorAll('button').forEach(button => button.remove());
      return content.textContent;
    };
    const originalText = originalRunbook();
    const lifecycle = ['installation-command', 'install-status', 'install-uninstall', 'installed-paths'];
    const commands = lifecycle.map(id => d.getElementById(id).textContent);
    for (const locale of ['en', 'vi']) {
      language(locale);
      check(d.getElementById('project-path').value === '/Projects/example app', `${locale}: switching language must preserve the project path`);
      check(d.getElementById('install-mode').value === 'copy' && d.getElementById('install-scope').value === 'project', `${locale}: installation choices must be preserved`);
      check(d.getElementById('installation-after').open, `${locale}: post-install instructions must stay open`);
      check(d.getElementById('cli-installation').open, `${locale}: expanded CLI controls must stay open`);
      check(JSON.stringify(lifecycle.map(id => d.getElementById(id).textContent)) === JSON.stringify(commands), `${locale}: executable commands and paths must not be translated`);
      check(d.getElementById('install-prompt').textContent.startsWith(locale === 'en' ? 'Read the runbook' : 'Hãy đọc runbook'), `${locale}: sample prompt must be translated`);
      check(d.getElementById('agent-install-prompt').textContent.startsWith(locale === 'en' ? 'Please install' : 'Hãy cài đặt skill'), `${locale}: quick install prompt must be translated separately`);
      check(!d.getElementById('agent-install-prompt').textContent.includes('/Projects/example app'), `${locale}: quick install must not inherit private CLI paths`);
      await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'Translated runbook controls must finish loading');
      check(originalRunbook() === originalText, `${locale}: original runbook content must not change`);
      const codeButton = d.querySelector('[data-copy-code]');
      if (codeButton) check(codeButton.textContent === (locale === 'en' ? 'Copy code' : 'Sao chép mã'), `${locale}: runbook controls must be translated`);
    }
    w.history.back();
    await waitFor(() => d.documentElement.lang === 'en', 'Back must restore English');
    w.history.forward();
    await waitFor(() => d.documentElement.lang === 'vi', 'Forward must restore Vietnamese');
    check(d.getElementById('project-path').value === '/Projects/example app', 'History navigation must preserve the private installation path');
    let sharedLink;
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true, value: { writeText: async text => { sharedLink = text; installPrompt = text; } } });
    d.querySelector('[data-share-skill]').click();
    check(new URL(sharedLink).searchParams.get('lang') === 'vi', 'Shared links must retain the interface language');
    check(!sharedLink.includes('Projects') && !sharedLink.includes('scope=') && !sharedLink.includes('mode='), 'Sharing must never disclose installation paths or settings');
    change('agent-select', 'all');
    change('install-scope', 'global');
    check(d.querySelector('[data-copy-skill]').disabled, 'Global all must not provide a misleading install command');
    check(d.querySelector('[data-copy-element="install-prompt"]').disabled, 'Invalid destinations must disable prompt copying');
    check(!d.querySelector('#skill-detail [data-copy-agent-prompt]').disabled, 'Global all CLI settings must not disable project-only chat installation');
    installPrompt = null;
    d.querySelector('#skill-detail [data-copy-agent-prompt]').click();
    await waitFor(() => Boolean(installPrompt), 'All-agent project installation prompt must copy');
    check(['.agents', '.codex', '.claude', '.cursor', '.windsurf', '.cline', '.github'].every(folder => installPrompt.includes(`"${folder}/skills/code-review/"`)), 'All-agent prompt must list all seven project destinations');
    change('install-scope', 'project');
    check(d.getElementById('installation-command').textContent.split('\n').length === 7, 'All-agent install must include all project folders');
    check(d.getElementById('install-status').textContent.split('\n').length === 7, 'All-agent status must check the same seven folders');
    change('agent-select', chosenAgent);
    change('install-scope', 'global');
    change('install-mode', 'link');
    d.querySelector('[data-back-library]').click();
    await wait(80);
    check(!d.getElementById('library-view').hidden, 'Library must be restored after closing detail');
    check(heading.getBoundingClientRect().height < 200, 'Returning to library must not expand the reel');
    check(agent.getBoundingClientRect().width > 20, 'Returning to library must restore the reel width');
    d.querySelector('a[href="#quickstart"]').click();
    check(d.getElementById('cli-setup').open, 'CLI help links must reveal setup instructions');
    d.querySelector('[data-install-skill]').click();
    check(d.activeElement.id === 'agent-select', 'Getting started must reach the actual installation controls');
    check(d.getElementById('cli-installation').open, 'CLI setup links must reveal the CLI controls');
    d.querySelector('[data-back-library]').click();
    language('en');
    d.getElementById('open-filters').click();
    check(d.getElementById('filters-dialog').open, 'Mobile filters must open');
    check(d.getElementById('filters-title').textContent === 'Filters', 'Mobile filter dialog must be translated');
    d.querySelector('[data-draft-group="blender"]').click();
    d.getElementById('apply-mobile-filters').click();
    check(!d.getElementById('filters-dialog').open, 'Applying filters must close the dialog');
    check(d.getElementById('results-status').textContent.includes('94'), 'Blender filter must show 94 skills');
    const search = d.getElementById('search-input');
    search.value = 'blender';
    search.dispatchEvent(new w.Event('input', { bubbles: true }));
    language('vi');
    check(search.value === 'blender' && new URL(w.location.href).searchParams.get('group') === 'blender', 'Language switch must preserve search and category filters');
    d.getElementById('hero-explore').click();
    check(d.activeElement.id === 'search-input', 'Explore action must focus search');
    check(d.getElementById('search-input').getBoundingClientRect().top < 300, 'Explore action must scroll to visible search');
    d.getElementById('youtube-collection').click();
    check(d.getElementById('results-status').textContent.includes('11'), 'YouTube collection must show 11 skills');
    change('quick-agent-select', 'cursor');
    check(selected() === 'cursor' && d.querySelector('[data-agent-install-label]').textContent.includes('Cursor'), 'List agent selection must update copy labels and shared state');
    check(new URL(w.location.href).searchParams.get('sources') === 'youtube', 'YouTube filter must be shareable');
    d.getElementById('open-filters').click();
    check(d.querySelector('input[name="mobile-source"][value="youtube"]').checked, 'Mobile filters must retain the YouTube source');
    d.getElementById('apply-mobile-filters').click();
    language('en');
    check(d.getElementById('youtube-collection').textContent === '11 skills · YouTube →', 'YouTube shortcut must have an English label');
    d.querySelector('[data-open-skill="youtube-agent-skill/yt-audit"]').click();
    await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'YouTube runbook must finish loading');
    check(d.getElementById('installed-paths').textContent.includes('/yt-audit/SKILL.md'), 'YouTube installation must use the leaf folder');
    check(d.getElementById('runbook-content').textContent.includes('shared-tools/hookscore.py'), 'YouTube audit must use its bundled helper');
    const voiceTemplate = d.querySelector('#runbook-content a[href$="/yt-audit/templates/voice.md"]');
    check(Boolean(voiceTemplate) && (await w.fetch(voiceTemplate.href)).ok, 'Voice profile template must be available beside the installed runbook');
    check(d.documentElement.scrollWidth <= w.innerWidth, 'YouTube details must fit mobile');
    d.querySelector('[data-back-library]').click();
    d.getElementById('open-filters').click();
    d.getElementById('mobile-reset').click();
    d.querySelector('input[name="mobile-source"][value="hallmark"]').click();
    d.getElementById('apply-mobile-filters').click();
    check(new URL(w.location.href).searchParams.get('sources') === 'hallmark', 'Hallmark source filtering must be shareable');
    check(d.querySelectorAll('#skills-results [data-skill]').length === 1, 'Hallmark must be one skill, not 50 theme skills');
    check(d.querySelector('input[name="source"][value="hallmark"]').checked, 'Desktop and mobile Hallmark source filters must agree');
    d.querySelector('[data-open-skill="hallmark"]').click();
    await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'Hallmark runbook must finish loading');
    check(d.getElementById('runbook-content').textContent.includes('TOGETHER_API_KEY'), 'Hallmark must expose optional service prerequisites');
    const hallmarkReference = d.querySelector('#runbook-content a[href*="/hallmark/references/"][href$=".md"]');
    check(Boolean(hallmarkReference) && (await w.fetch(hallmarkReference.href)).ok, 'Hallmark local references must load beside the runbook');
    const manifestBase = new URL(d.documentElement.dataset.skillBase === '..' ? '../_site/' : './', w.location.href);
    const hallmarkManifest = await (await w.fetch(new URL('install-manifests/hallmark.json', manifestBase))).json();
    check(hallmarkManifest.available && hallmarkManifest.files.length === 182, 'Hallmark copy must use a complete committed manifest');
    check(hallmarkManifest.revision !== '8f6969f8922caabde9de1784959eae11ddf68073', 'Manifest must pin VAS, not the upstream commit');
    const preview = hallmarkManifest.files.find(file => file.path.endsWith('.jpg'));
    const skillRoot = new URL(`${d.documentElement.dataset.skillBase}/skills/hallmark/`, w.location.href);
    const previewResponse = await w.fetch(new URL(preview.path, skillRoot));
    check(previewResponse.ok && (await previewResponse.arrayBuffer()).byteLength === preview.bytes, 'Bundled Hallmark theme previews must be complete');
    for (const locale of ['vi', 'en']) {
      language(locale);
      installPrompt = null;
      d.querySelector('#skill-detail [data-copy-agent-prompt]').click();
      await waitFor(() => Boolean(installPrompt), 'Hallmark installation prompt must copy');
      check(installPrompt.startsWith(locale === 'vi' ? 'Hãy cài đặt skill' : 'Please install'), 'Hallmark copied prompts must follow the interface language');
      check(installPrompt.includes('".cursor/skills/hallmark/"'), 'Hallmark prompts must retain the selected Cursor destination');
      for (const width of [1440, 390, 320]) {
        frame.style.width = `${width}px`;
        await wait(80);
        check(d.documentElement.scrollWidth <= w.innerWidth, `Hallmark ${locale} ${width}px: details must fit the viewport`);
      }
    }
    d.querySelector('[data-back-library]').click();
    d.getElementById('typesafe-collection').click();
    check(new URL(w.location.href).searchParams.get('sources') === 'typesafe', 'TypeSafe shortcut must select its source');
    check(d.querySelectorAll('#skills-results [data-skill]').length === 1, 'TypeSafe source must contain exactly one skill');
    d.getElementById('open-filters').click();
    check(d.querySelector('input[name="mobile-source"][value="typesafe"]').checked, 'Mobile filters must retain the TypeSafe source');
    d.getElementById('apply-mobile-filters').click();
    check(d.querySelector('input[name="source"][value="typesafe"]').checked, 'Desktop and mobile TypeSafe sources must agree');
    d.querySelector('[data-open-skill="typesafe-ai"]').click();
    await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', 'TypeSafe runbook must finish loading');
    check(d.getElementById('runbook-content').textContent.includes('TYPESAFE_API_KEY'), 'TypeSafe must expose service prerequisites');
    check(d.getElementById('runbook-content').textContent.replace(/\s+/g, ' ').includes('Ask the user for permission first'), 'TypeSafe must retain API consent instructions');
    const typesafeManifest = await (await w.fetch(new URL('install-manifests/typesafe-ai.json', manifestBase))).json();
    check(typesafeManifest.available && typesafeManifest.files.length === 2, 'TypeSafe quick installation must use the complete committed payload');
    check(typesafeManifest.revision !== '302eea662c54bca6730873fe245bec1d69ebc23d', 'TypeSafe manifest must pin VAS, not upstream');
    const typesafeRoot = new URL(`${d.documentElement.dataset.skillBase}/skills/typesafe-ai/`, w.location.href);
    const licenseResponse = await w.fetch(new URL('LICENSE', typesafeRoot));
    check(licenseResponse.ok && (await licenseResponse.text()).includes('Copyright (c) 2026 TypeSafe AI'), 'TypeSafe license must ship beside the runbook');
    for (const locale of ['vi', 'en']) {
      language(locale);
      for (const target of ['cursor', 'copilot']) {
        change('agent-select', target);
        installPrompt = null;
        d.querySelector('#skill-detail [data-copy-agent-prompt]').click();
        await waitFor(() => Boolean(installPrompt), 'TypeSafe installation prompt must copy');
        check(installPrompt.startsWith(locale === 'vi' ? 'Hãy cài đặt skill' : 'Please install'), 'TypeSafe prompts must follow the interface language');
        const folder = target === 'cursor' ? '.cursor' : '.github';
        check(installPrompt.includes(`"${folder}/skills/typesafe-ai/"`), 'TypeSafe prompts must follow agent changes');
      }
      for (const width of [1440, 390, 320]) {
        frame.style.width = `${width}px`;
        await wait(80);
        check(d.documentElement.scrollWidth <= w.innerWidth, `TypeSafe ${locale} ${width}px: details must fit the viewport`);
      }
    }
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true, value: { writeText: async () => { throw new Error('Clipboard blocked for test'); } } });
    d.querySelector('#skill-detail [data-copy-agent-prompt]').click();
    await waitFor(() => !d.getElementById('manual-copy').hidden, 'TypeSafe clipboard failure must show manual recovery');
    check(d.getElementById('manual-copy-text').value.includes('/install-manifests/typesafe-ai.json'), 'Manual recovery must contain the same safe TypeSafe prompt');
    d.getElementById('close-manual-copy').click();
    d.querySelector('[data-back-library]').click();
    d.getElementById('android-collection').click();
    check(new URL(w.location.href).searchParams.get('sources') === 'android', 'Android collection must select its source');
    check(d.getElementById('results-status').textContent.includes('35'), 'Android source must contain 35 skills, excluding existing android-cli');
    d.getElementById('open-filters').click();
    check(d.querySelector('input[name="mobile-source"][value="android"]').checked, 'Android mobile source must remain selected');
    d.getElementById('apply-mobile-filters').click();
    check(d.querySelector('input[name="source"][value="android"]').checked, 'Android desktop and mobile filters must agree');
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true, value: { writeText: async text => { installPrompt = text; } } });
    while (!d.getElementById('load-more').hidden) d.getElementById('load-more').click();
    for (const id of ['navigation-3', 'play-policy-insights', 'android-profiler']) {
      d.querySelector(`[data-open-skill="${id}"]`).click();
      await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', `${id}: Android runbook must finish loading`);
      check(d.getElementById('runbook-content').textContent.includes('VAS installation notes'), `${id}: prerequisites must be available`);
      check(d.getElementById('skill-detail').textContent.includes('Apache-2.0'), `${id}: source license must be visible`);
      const manifest = await (await w.fetch(new URL(`install-manifests/${id}.json`, manifestBase))).json();
      check(manifest.available && manifest.files.some(file => file.path === 'LICENSE.txt'), `${id}: complete committed manifest must include its license`);
      check(manifest.revision !== '6daa53ef27fa2aa87827d183a85c06cedceca833', `${id}: pin VAS, not upstream`);
      const root = new URL(`${d.documentElement.dataset.skillBase}/skills/${id}/`, w.location.href);
      const license = await w.fetch(new URL('LICENSE.txt', root));
      check(license.ok && (await license.text()).includes('Apache License'), `${id}: bundled license must load`);
      if (id === 'play-policy-insights') {
        const helper = manifest.files.find(file => file.path === 'scripts/template_engine.py');
        check(Boolean(helper) && (await w.fetch(new URL(helper.path, root))).ok, 'Android helper dependencies must load beside the runbook');
      }
      for (const locale of ['vi', 'en']) {
        language(locale);
        for (const target of ['cursor', 'copilot']) {
          change('agent-select', target);
          installPrompt = null;
          d.querySelector('#skill-detail [data-copy-agent-prompt]').click();
          await waitFor(() => Boolean(installPrompt), `${id}: copy prompt must work`);
          check(installPrompt.startsWith(locale === 'vi' ? 'Hãy cài đặt skill' : 'Please install'), `${id}: copy language must update`);
          const folder = target === 'cursor' ? '.cursor' : '.github';
          check(installPrompt.includes(`"${folder}/skills/${id}/"`), `${id}: copy destination must follow agent changes`);
        }
        for (const width of [1440, 390, 320]) {
          frame.style.width = `${width}px`;
          await wait(80);
          check(d.documentElement.scrollWidth <= w.innerWidth, `${id} ${locale} ${width}px: no page overflow`);
        }
      }
      d.querySelector('[data-back-library]').click();
    }
    d.querySelector('[data-open-skill="play-policy-insights"]').click();
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true, value: { writeText: async () => { throw new Error('Clipboard blocked for Android test'); } } });
    d.querySelector('#skill-detail [data-copy-agent-prompt]').click();
    await waitFor(() => !d.getElementById('manual-copy').hidden, 'Android clipboard failure must show manual recovery');
    check(d.getElementById('manual-copy-text').value.includes('/install-manifests/play-policy-insights.json'), 'Android fallback must preserve the safe prompt');
    d.getElementById('close-manual-copy').click();
    d.querySelector('[data-back-library]').click();
    d.getElementById('gamedev-collection').click();
    check(new URL(w.location.href).searchParams.get('sources') === 'gamedev', `GameDev shortcut must select its source (${w.location.search}; ${d.getElementById('results-status').textContent})`);
    check(d.getElementById('results-status').textContent.includes('78'), 'GameDev must have 78 records, not additional companion skills');
    d.getElementById('open-filters').click();
    check(d.querySelector('input[name="mobile-source"][value="gamedev"]').checked, 'GameDev mobile source must remain selected');
    d.getElementById('apply-mobile-filters').click();
    check(d.querySelector('input[name="source"][value="gamedev"]').checked, 'GameDev desktop source must agree');
    while (!d.getElementById('load-more').hidden) d.getElementById('load-more').click();
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true, value: { writeText: async text => { installPrompt = text; } } });
    for (const id of ['router', 'ebitengine-game', 'gamedev-performance-optimization']) {
      d.querySelector(`[data-open-skill="${id}"]`).click();
      await waitFor(() => d.getElementById('runbook-content').getAttribute('aria-busy') === 'false', `${id}: GameDev runbook must load`);
      check(d.getElementById('runbook-content').textContent.includes('VAS installation notes'), `${id}: installation prerequisites must be visible`);
      check(d.getElementById('skill-detail').textContent.includes('Apache-2.0'), `${id}: license must be visible`);
      const manifest = await (await w.fetch(new URL(`install-manifests/${id}.json`, manifestBase))).json();
      check(manifest.available && manifest.files.some(file => file.path === 'NOTICE'), `${id}: complete committed manifest must include NOTICE`);
      check(manifest.revision !== '19d93f97c9c1ea0f8b306e77aa81e0d3e352d3e9', `${id}: pin the VAS publication, not upstream`);
      const root = new URL(`${d.documentElement.dataset.skillBase}/skills/${id}/`, w.location.href);
      const notice = await w.fetch(new URL('NOTICE', root));
      check(notice.ok && (await notice.text()).includes('Abhishek Barali'), `${id}: original notice must load`);
      if (id === 'router') {
        const companion = manifest.files.find(file => file.path.endsWith('/ebitengine-game/RUNBOOK.md'));
        check(Boolean(companion) && (await w.fetch(new URL(companion.path, root))).ok, 'Standalone router companions must be publicly readable');
      }
      for (const locale of ['vi', 'en']) {
        language(locale);
        for (const target of ['cursor', 'copilot']) {
          change('agent-select', target);
          installPrompt = null;
          d.querySelector('#skill-detail [data-copy-agent-prompt]').click();
          await waitFor(() => Boolean(installPrompt), `${id}: GameDev prompt must copy`);
          check(installPrompt.startsWith(locale === 'vi' ? 'Hãy cài đặt skill' : 'Please install'), `${id}: prompt language must switch`);
          const folder = target === 'cursor' ? '.cursor' : '.github';
          check(installPrompt.includes(`"${folder}/skills/${id}/"`), `${id}: selected agent destination must be retained`);
        }
        for (const width of [1440, 390, 320]) {
          frame.style.width = `${width}px`;
          await wait(80);
          check(d.documentElement.scrollWidth <= w.innerWidth, `${id} ${locale} ${width}px: no overflow`);
        }
      }
      d.querySelector('[data-back-library]').click();
    }
    d.querySelector('[data-open-skill="router"]').click();
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true, value: { writeText: async () => { throw new Error('GameDev clipboard blocked for test'); } } });
    d.querySelector('#skill-detail [data-copy-agent-prompt]').click();
    await waitFor(() => !d.getElementById('manual-copy').hidden, 'GameDev clipboard failure must show manual recovery');
    check(d.getElementById('manual-copy-text').value.includes('/install-manifests/router.json'), 'GameDev recovery must retain the safe router prompt');
    d.getElementById('close-manual-copy').click();
    language('vi');
    const probe = document.createElement('iframe');
    probe.style.cssText = 'display:block;border:0;height:1000px;width:390px';
    document.body.append(probe);
    try {
      const loadProbe = async query => {
        const loaded = new Promise(resolve => { probe.onload = resolve; });
        probe.src = `${page}?${query}&language-check=${Date.now()}`;
        await loaded;
        await waitFor(() => probe.contentDocument.querySelector('[data-skill], #agent-select'), 'Language preference probe must load');
        return probe.contentDocument;
      };
      localStorage.setItem('vas-language', 'vi');
      const english = await loadProbe('lang=en&skill=blender-skills%2Fblender-director&agent=codex');
      check(english.documentElement.lang === 'en', 'Explicit English deep link must override the saved Vietnamese preference');
      check(english.getElementById('home-link').getAttribute('href') === './?lang=en', 'Home navigation must retain the active language');
      check(english.getElementById('detail-title').textContent === 'blender-skills/blender-director', 'Language deep link must open the selected namespaced skill');
      check(english.getElementById('installation-command').textContent.startsWith('Enter an absolute project path'), 'Invalid project paths must have English guidance');
      check(english.documentElement.scrollWidth <= probe.contentWindow.innerWidth, 'English detail must fit mobile');
      localStorage.setItem('vas-language', 'en');
      check((await loadProbe('lang=vi')).documentElement.lang === 'vi', 'Explicit Vietnamese link must override saved English');
      check((await loadProbe('')).documentElement.lang === 'en', 'A fresh visit must restore the saved language');
    } finally { probe.remove(); }
  } catch (error) {
    errors.push(error.stack || String(error));
  } finally {
    if (savedLanguage === null) localStorage.removeItem('vas-language');
    else localStorage.setItem('vas-language', savedLanguage);
  }
  document.getElementById('layout-result').textContent = JSON.stringify({ errors, measurements });
  document.documentElement.dataset.layoutComplete = 'true';
})();
</script>
</body>
</html>
